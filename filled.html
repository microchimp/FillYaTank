<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Thanks for filling up — FillYaTank</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=18">
</head>
<body class="simple-page">
    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/" aria-label="FillYaTank home">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="#1e7d46"/>
                    <path d="M5 10 L14 20 L16.5 8 L25 21" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
                    <circle cx="25" cy="21" r="3.4" fill="#fff"/>
                </svg>
                FillYaTank
            </a>
        </div>
    </header>

    <main class="simple-main">
        <div class="simple-card" role="status" aria-live="polite">
            <div id="loading">
                <svg class="state-icon busy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
                <h1>One sec…</h1>
            </div>

            <div id="success" class="hidden">
                <svg class="state-icon ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l3 3 5-6"/></svg>
                <h1>Nice one! ⛽</h1>
                <p>Thanks for letting us know. Know someone who drives?</p>
                <a class="button" href="/?ref=filled">Share FillYaTank</a>
            </div>

            <div id="error" class="hidden">
                <svg class="state-icon bad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
                <h1>That link didn't work</h1>
                <p>Thanks for filling up anyway!</p>
                <a class="button" href="/">Back to FillYaTank</a>
            </div>
        </div>
    </main>

    <script>
        // Counted only when this page runs in a browser, so email link scanners don't inflate the total
        const API_ENDPOINT = 'https://api.fillyatank.app';

        function show(id) {
            ['loading', 'success', 'error'].forEach(state => {
                document.getElementById(state).classList.toggle('hidden', state !== id);
            });
        }

        async function recordFill() {
            const params = new URLSearchParams(window.location.search);
            const query = ['city', 'd', 'u', 't'].map(k => `${k}=${encodeURIComponent(params.get(k) || '')}`).join('&');
            try {
                const response = await fetch(`${API_ENDPOINT}/?action=filled&${query}`, { method: 'POST' });
                show(response.ok ? 'success' : 'error');
            } catch (e) {
                show('success');
            }
        }

        recordFill();
    </script>
</body>
</html>

name: Fuel Price Check

on:
  schedule:
    # Run Mon/Wed/Fri at 02:30 UTC = 12:30pm AEST (13:30 AEDT)
    - cron: '30 2 * * 1,3,5'
  
  workflow_dispatch:
    inputs:
      simulate_buy_city:
        description: 'TEST: simulate a price drop in this city (emails only the TEST_EMAIL secret; state.json untouched). Leave blank for a normal run.'
        required: false
        default: ''
        type: choice
        options: ['', sydney, melbourne, brisbane, adelaide, perth]
      classify_text:
        description: 'DEBUG: classify this buying-tip text (rules, then free AI if unclear) and print the result. No emails, no commits.'
        required: false
        default: ''
        type: string
      send_stats_report:
        description: 'Only email the owner a stats summary (views, sign-ups, subscribers) — no price check.'
        required: false
        default: false
        type: boolean

# Least privilege: the job only needs to push data/ commits
permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Test classifier rules
        run: python test_parser.py
      
      - name: Run price check
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SIMULATE_BUY_CITY: ${{ inputs.simulate_buy_city }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          STATS_REPORT: ${{ inputs.send_stats_report }}
          CLASSIFY_TEXT: ${{ inputs.classify_text }}
        run: |
          python main.py
      
      - name: Commit state changes
        if: ${{ !inputs.simulate_buy_city && !inputs.send_stats_report && !inputs.classify_text }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Record every run so the repo always has recent activity; GitHub
          # disables scheduled workflows after 60 days without any.
          date -u +%Y-%m-%d > data/last_run.txt
          git add data/state.json data/last_run.txt data/wordings.json
          git diff --staged --quiet && exit 0
          git commit -m "Update price state [skip ci]"
          git pull --rebase
          git push

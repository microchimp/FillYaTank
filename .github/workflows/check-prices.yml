name: Fuel Price Check

on:
  schedule:
    # Run Mon/Wed/Fri at 02:30 UTC = 12:30pm AEST (13:30 AEDT)
    - cron: '30 2 * * 1,3,5'
  
  workflow_dispatch:
    inputs:
      simulate_buy_city:
        description: 'TEST: simulate a price drop in this city (emails only the TEST_EMAIL secret; state.json untouched). Leave blank for a normal run.'
        required: false
        default: ''
        type: choice
        options: ['', sydney, melbourne, brisbane, adelaide, perth]

# Least privilege: the job only needs to push data/ commits
permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run price check
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SIMULATE_BUY_CITY: ${{ inputs.simulate_buy_city }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        run: |
          python main.py
      
      - name: Commit state changes
        if: ${{ !inputs.simulate_buy_city }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Record every run so the repo always has recent activity; GitHub
          # disables scheduled workflows after 60 days without any.
          date -u +%Y-%m-%d > data/last_run.txt
          git add data/state.json data/last_run.txt
          git diff --staged --quiet || git commit -m "Update price state [skip ci]"
          git push

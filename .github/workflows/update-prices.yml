name: Update Price Charts

on:
  schedule:
    # Daily at 22:30 UTC = 8:30am AEST (9:30am AEDT), after FuelWatch publishes the previous day
    - cron: '30 22 * * *'
  workflow_dispatch:

# Least privilege: the job only needs to push data/prices.json
permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build price history
        run: python prices.py

      - name: Commit price data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/prices.json
          git diff --staged --quiet && exit 0
          git commit -m "Update price charts"
          git pull --rebase
          git push

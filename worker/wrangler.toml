name = "fillyatank-signup"
main = "src/index.js"
compatibility_date = "2026-09-01"
preview_urls = false

[vars]
SITE_URL = "https://fillyatank.app"
FROM_EMAIL = "alerts@fillyatank.app"

# Subscribers are stored as keys "<city>:<email>".
# Create with: npx wrangler kv namespace create SUBSCRIBERS  (then paste the id below)
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "05eb6feea11245499e7dc17cc4f3c8bd"

# Workers AI (free daily allocation) for classifying unfamiliar ACCC wording
[ai]
binding = "AI"

# Max 5 signup submissions per minute per IP address
[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (set with `npx wrangler secret put <NAME>`, never commit):
#   RESEND_API_KEY - Resend API key
#   SECRET_KEY     - HMAC key for confirm/unsubscribe tokens; must match the GitHub secret
#   ADMIN_TOKEN    - bearer token main.py uses to read the subscriber list; must match the GitHub secret
